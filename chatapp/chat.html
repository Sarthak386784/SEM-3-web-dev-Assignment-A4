<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Rooms</title>
<script src="https://cdn.socket.io/4.8.4/socket.io.min.js"
  integrity="sha384-fBrXvbDtHoeKWJ/hcA6M+YGueiDW+h45I7V6F2kD1S8bOkrF9rZYPLVkCR6BLR/1"
  crossorigin="anonymous"></script>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--text:#1d2129;--muted:#6b7280;--line:#e3e5e9;--accent:#4f46e5;--accent-t:#fff;--mine:#4f46e5;--mine-t:#fff;--theirs:#eceef2}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--panel:#1a1d24;--text:#e8eaed;--muted:#8b93a1;--line:#2a2e38;--accent:#7c83ff;--accent-t:#0e1016;--mine:#5a62e8;--mine-t:#fff;--theirs:#262a33}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex}
button,input{font:inherit;color:inherit}
input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
button{background:var(--accent);color:var(--accent-t);border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
aside{width:290px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
aside section{padding:14px;border-bottom:1px solid var(--line)}
h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.me{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#ef4444}.dot.on{background:#22c55e}
.room{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer}
.room:hover,.room.active{background:var(--bg)}.room.active{font-weight:600}
.room small{color:var(--muted)}
.badge{background:var(--accent);color:var(--accent-t);border-radius:10px;padding:0 7px;font-size:12px}
.room button{padding:3px 10px;font-size:13px}
form.row{display:flex;gap:6px;margin-top:6px}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;margin-top:6px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
header b{font-size:17px}header div small{display:block;color:var(--muted)}
#msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px}
.m{max-width:70%;padding:8px 12px;border-radius:14px;background:var(--theirs);align-self:flex-start;overflow-wrap:anywhere}
.m.own{background:var(--mine);color:var(--mine-t);align-self:flex-end}
.m .who{font-size:12px;font-weight:600;opacity:.75}.m .t{font-size:11px;opacity:.6;margin-left:6px}
.sys{align-self:center;color:var(--muted);font-size:13px}
#composer{display:flex;gap:8px;padding:12px 18px;background:var(--panel);border-top:1px solid var(--line)}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:5}
#login form{background:var(--panel);padding:28px;border-radius:14px;width:320px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
#login h2{margin:0}.err{color:#ef4444;font-size:13px;min-height:1em}
@media(max-width:700px){aside{width:100%;max-height:45vh}body{flex-direction:column}}
</style>
</head>
<body>
<div id="login">
  <form id="loginForm">
    <h2>Join the chat</h2>
    <input id="nameIn" type="text" placeholder="Pick a display name" maxlength="20" autofocus>
    <button>Enter</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<aside>
  <section><div class="me"><span class="dot" id="dot"></span><span id="meName">—</span></div></section>
  <section><h3>My rooms</h3><div id="myRooms"></div></section>
  <section><h3>Discover</h3><div id="discover"></div></section>
  <section>
    <h3>Create a room</h3>
    <form id="createForm"><div class="row" style="display:flex;gap:6px">
      <input id="newRoom" type="text" placeholder="Room name" maxlength="30"><button>Create</button></div>
      <label class="chk"><input type="checkbox" id="priv"> Private (hidden from list)</label></form>
    <h3 style="margin-top:14px">Join by name</h3>
    <form id="joinForm" class="row"><input id="joinName" type="text" placeholder="Room name"><button>Join</button></form>
    <div class="err" id="sideErr"></div>
  </section>
</aside>

<main>
  <header>
    <div><b id="roomTitle"># general</b><small id="roomMembers"></small></div>
    <button class="ghost" id="leaveBtn">Leave</button>
  </header>
  <div id="msgs"></div>
  <form id="composer"><input id="text" type="text" placeholder="Type a message" autocomplete="off" maxlength="1000"><button>Send</button></form>
</main>

<script>
// Same-origin when served by Express; falls back to localhost:8080 for file://
const socket = io(location.protocol.startsWith("http") ? undefined : "http://localhost:8080",
  { transports: ["websocket"] });
const $ = id => document.getElementById(id);
const call = (ev, ...a) => new Promise(r => socket.emit(ev, ...a, r));
const S = { me: "", active: "general", list: [], rooms: {} };
const R = n => (S.rooms[n] ??= { msgs: [], unread: 0, members: [], joined: false });
const sys = text => ({ type: "sys", text });
R("general");

// ---- rendering (textContent only, so user text can't inject HTML) ----
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function renderSide() {
  const mine = $("myRooms"); mine.replaceChildren();
  Object.entries(S.rooms).filter(([, r]) => r.joined).forEach(([n, r]) => {
    const d = el("div", "room" + (n === S.active ? " active" : ""));
    d.append(el("span", "", "# " + n));
    if (r.unread) d.append(el("span", "badge", r.unread));
    d.onclick = () => openRoom(n);
    mine.append(d);
  });
  const disc = $("discover"); disc.replaceChildren();
  const others = S.list.filter(r => !R(r.name).joined);
  if (!others.length) disc.append(el("small", "", "No other public rooms yet"));
  others.forEach(r => {
    const d = el("div", "room"); const l = el("span", "", "# " + r.name);
    l.append(el("small", "", `  ${r.count} online`));
    const b = el("button", "", "Join"); b.onclick = () => joinRoom(r.name);
    d.append(l, b); disc.append(d);
  });
}
function renderHead() {
  const r = R(S.active);
  $("roomTitle").textContent = "# " + S.active;
  $("roomMembers").textContent = r.members.length ? r.members.join(", ") : "";
  $("leaveBtn").style.display = S.active === "general" ? "none" : "";
}
function renderMsgs() {
  const box = $("msgs"); box.replaceChildren();
  R(S.active).msgs.forEach(m => {
    if (m.type === "sys") return box.append(el("div", "sys", m.text));
    const d = el("div", "m" + (m.own ? " own" : ""));
    const who = el("div", "who", m.own ? "You" : m.user);
    who.append(el("span", "t", new Date(m.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })));
    d.append(who, el("div", "", m.text)); box.append(d);
  });
  box.scrollTop = box.scrollHeight;
}
function add(room, m) {
  const r = R(room); r.msgs.push(m);
  if (room !== S.active && m.type !== "sys") r.unread++;
  renderSide(); if (room === S.active) renderMsgs();
}
function openRoom(n) { S.active = n; R(n).unread = 0; renderSide(); renderHead(); renderMsgs(); }

// ---- actions ----
async function joinRoom(n) {
  const r = await call("join_room", n);
  if (!r.ok) { $("sideErr").textContent = r.error; return false; }
  $("sideErr").textContent = ""; R(r.room).joined = true; openRoom(r.room); return true;
}
async function login(name) {
  const r = await call("set_username", name);
  if (!r.ok) { $("loginErr").textContent = r.error; return; }
  S.me = r.username; $("meName").textContent = S.me; $("login").style.display = "none";
  const names = new Set(["general", ...Object.keys(S.rooms).filter(n => S.rooms[n].joined)]);
  for (const n of names) { const j = await call("join_room", n); R(n).joined = !!j.ok; }
  S.list = await call("list_rooms");
  if (!R(S.active).joined) S.active = "general";
  renderSide(); renderHead(); renderMsgs();
}

$("loginForm").onsubmit = e => { e.preventDefault(); login($("nameIn").value); };
$("createForm").onsubmit = async e => {
  e.preventDefault();
  const r = await call("create_room", { name: $("newRoom").value, isPrivate: $("priv").checked });
  if (!r.ok) return $("sideErr").textContent = r.error;
  $("sideErr").textContent = ""; $("newRoom").value = ""; R(r.room).joined = true; openRoom(r.room);
};
$("joinForm").onsubmit = async e => { e.preventDefault(); if (await joinRoom($("joinName").value.trim())) $("joinName").value = ""; };
$("leaveBtn").onclick = () => {
  const n = S.active; socket.emit("leave_room", n);
  Object.assign(R(n), { joined: false, msgs: [], members: [], unread: 0 }); openRoom("general");
};
$("composer").onsubmit = e => {
  e.preventDefault(); const t = $("text").value.trim(); if (!t) return;
  socket.emit("room_message", { room: S.active, text: t }); $("text").value = "";
};

// ---- socket events ----
// Original backend events, shown as system notes in #general
socket.on("gyankibaat", t => add("general", sys(t)));
socket.on("join", t => add("general", sys(t)));
socket.on("announcement", t => add("general", sys(t)));
// New room events
socket.on("room_message", m => add(m.room, { ...m, type: "msg", own: m.id === socket.id }));
socket.on("room_system", ({ room, text }) => add(room, sys(text)));
socket.on("room_members", ({ room, members }) => { R(room).members = members; if (room === S.active) renderHead(); });
socket.on("rooms_update", l => { S.list = l; renderSide(); });
socket.on("connect", () => { $("dot").classList.add("on"); if (S.me) login(S.me); }); // re-join after reconnect
socket.on("disconnect", () => $("dot").classList.remove("on"));
</script>
</body>
</html>
